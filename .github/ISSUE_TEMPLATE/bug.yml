name: Bug report · Ошибка
description: Something doesn't work as expected · Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Cooldown! English or Russian — both are fine.
        Спасибо, что тестируете Cooldown! Можно писать по-английски или по-русски.
  - type: textarea
    id: what
    attributes:
      label: What happened · Что случилось
      description: What you did, what you expected and what you saw instead. · Что делали, чего ждали и что получилось.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report · Отчёт диагностики
      description: |
        Settings → Diagnostics → Check everything → Copy report. It contains no paths or personal data.
        Настройки → Диагностика → «Проверить всё» → «Скопировать отчёт». В нём нет путей и личных данных.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions · Версии
      description: Cooldown, macOS, Codex / Claude Code / Claude Desktop
      placeholder: Cooldown 1.2.0, macOS 26.1, Codex 26.4, Claude Code 2.3
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots · Скриншоты
      description: Optional. Please hide anything private. · Необязательно. Скройте личное.
